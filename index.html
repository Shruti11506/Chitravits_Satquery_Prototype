<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/chitravits_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHITRAVITS — SatQuery AI | Agentic Remote Sensing Intelligence</title>
    <meta name="description" content="Chitravits SatQuery AI is an enterprise-grade agentic Remote Sensing Vision-Language platform. Zero GIS knowledge required." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('satquery-theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <!-- Typography: Inter (Executive Enterprise Standard) & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
